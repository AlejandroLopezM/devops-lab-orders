name: CI - Integración Continua U3

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  NODE_VERSION: '18'
  REGISTRY: ghcr.io
  IMAGE_FULL: ghcr.io/alejandrolopezm/devops-lab-orders

jobs:
  ci:
    name: CI - Build, Test, Security & Validate
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write
      packages: write
      security-events: write

    steps:

      # ── STAGE 1: Checkout ───────────────────────────────────────────────────
      - name: "Stage 1 - Checkout código fuente"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── STAGE 2: Setup Node.js ──────────────────────────────────────────────
      - name: "Stage 2 - Configurar Node.js ${{ env.NODE_VERSION }}"
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      # ── STAGE 3: Instalar dependencias ──────────────────────────────────────
      - name: "Stage 3 - Instalar dependencias"
        run: |
          echo "📦 Instalando dependencias..."
          npm ci
          echo "✅ Dependencias instaladas"

      # ── STAGE 4: Pruebas unitarias ──────────────────────────────────────────
      - name: "Stage 4 - Ejecutar pruebas unitarias (Jest)"
        run: |
          echo "🧪 Ejecutando pruebas unitarias..."
          npm run test:ci
          echo "✅ 12/12 pruebas pasaron"

      # ── STAGE 5: Reporte de cobertura ───────────────────────────────────────
      - name: "Stage 5 - Publicar reporte de cobertura"
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

      # ── STAGE 6: Análisis estático de código ────────────────────────────────
      - name: "Stage 6 - Análisis estático de código"
        run: |
          echo "🔍 Ejecutando análisis estático..."
          node --check src/app.js
          node --check index.js
          echo "✅ Análisis estático completado"

      # ── STAGE 7: Snyk - Escaneo de vulnerabilidades en dependencias ─────────
      - name: "Stage 7 - Snyk: escaneo de vulnerabilidades en dependencias"
        uses: snyk/actions/node@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high --json-file-output=snyk-report.json

      # ── STAGE 8: Publicar reporte Snyk ──────────────────────────────────────
      - name: "Stage 8 - Publicar reporte Snyk"
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: snyk-security-report
          path: snyk-report.json
          retention-days: 7

      # ── STAGE 9: Caché de capas Docker (mejora sugerida por la profe) ───────
      - name: "Stage 9 - Configurar caché de capas Docker"
        uses: docker/setup-buildx-action@v3

      # ── STAGE 10: Construir imagen Docker con caché ─────────────────────────
      - name: "Stage 10 - Construir imagen Docker (con caché de capas)"
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: ${{ env.IMAGE_FULL }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          load: true

      # ── STAGE 11: Trivy - Escaneo de seguridad en imagen Docker ────────────
      - name: "Stage 11 - Trivy: escaneo de seguridad en imagen Docker"
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_FULL }}:${{ github.sha }}
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

      # ── STAGE 12: Login en ghcr.io ──────────────────────────────────────────
      - name: "Stage 12 - Autenticación en GitHub Container Registry"
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── STAGE 13: Push imagen al registry ───────────────────────────────────
      - name: "Stage 13 - Publicar imagen en ghcr.io"
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_FULL }}:${{ github.sha }}
            ${{ env.IMAGE_FULL }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── STAGE 14: Resumen del pipeline ──────────────────────────────────────
      - name: "Stage 14 - Resumen del CI"
        if: always()
        run: |
          echo "═══════════════════════════════════════════"
          echo "  RESUMEN DEL PIPELINE CI - UNIDAD 3"
          echo "═══════════════════════════════════════════"
          echo "  Repositorio : ${{ github.repository }}"
          echo "  Rama        : ${{ github.ref_name }}"
          echo "  Commit SHA  : ${{ github.sha }}"
          echo "  Ejecutado   : ${{ github.actor }}"
          echo "  Seguridad   : Snyk + Trivy ✅"
          echo "  Caché Docker: Habilitado ✅"
          echo "═══════════════════════════════════════════"
